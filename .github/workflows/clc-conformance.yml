name: clc-conformance

# CLC-v1 语义一致性：本仓（Go 参考实现）必须与 capability 仓的向量逐条一致
# （verdict + 规范码 reason 双断言；失败时 vectors-run 退出码非 0）。
# 依赖：向量在独立仓 varwof/capability，本 workflow 会浅克隆到 ../capability。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Fetch CLC-v1 vectors (capability repo)
        run: git clone --depth 1 https://github.com/varwof/capability.git ../capability

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: CLC-v1 vectors (verdict + reason)
        env:
          CLC_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/vectors.json
        run: go run ./cmd/vectors-run/

      - name: P11 property (composition narrows only)
        # -count=1 disables the test cache: the property corpus lives OUTSIDE
        # this module, so a corpus change is invisible to Go's cache and a
        # cached run would report the previous run's counters (it did: 281/274
        # vs the real 299/290).
        env:
          # Absolute path: `go test` runs the test binary with CWD = ./semantics,
          # so a repo-root-relative path silently skips this gate.
          CLC_PROPERTY_CASES: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/property-cases.json
        run: go test -count=1 ./semantics/ -run TestIntersectionProperty -v

      - name: CLC-D containment vectors (contains + reason)
        env:
          CLC_D_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-d/containment-vectors.json
        run: go run ./cmd/contains-vectors-run/

      - name: CLC-D forward-closure property
        env:
          CLC_D_PROPERTY_CASES: ${{ github.workspace }}/../capability/data/_vectors/clc-d/containment-property-cases.json
        run: go test -count=1 ./semantics/ -run TestContainsProperty -v

      - name: CLC-D containment cross-walk (carrier → CLC grants)
        env:
          CLC_D_CROSSWALK_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-d/containment-crosswalk-vectors.json
        run: go run ./cmd/contains-crosswalk-run/

      - name: CLC-1.10 extended parameter bounds (verdict + reason)
        env:
          CLC_PARAM_BOUNDS_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/param-bounds-vectors.json
        run: go run ./cmd/param-bounds-vectors-run/

      - name: CLC-1.11 Resolve (verdict + reason + obligations)
        env:
          CLC_RESOLVE_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/resolve-vectors.json
        run: go run ./cmd/resolve-vectors-run/

      - name: CLC-1.12 ConstraintUnion (normalized union)
        env:
          CLC_CONSTRAINT_UNION_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/constraint-union-vectors.json
        run: go run ./cmd/constraint-union-vectors-run/

      - name: CLC-1.14 BoundMeet (param_bounds intersection)
        env:
          CLC_PARAM_BOUNDS_MEET_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-v1/param-bounds-meet-vectors.json
        run: go run ./cmd/param-bounds-meet-vectors-run/

      - name: CLC-1.13 AuthorizeWithChain (fused chain check)
        env:
          CLC_AUTHORIZE_CHAIN_VECTORS: ${{ github.workspace }}/../capability/data/_vectors/clc-d/authorize-chain-vectors.json
        run: go run ./cmd/authorize-chain-vectors-run/
