name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The corpus suites live on Linux: clc-conformance runs them with the
      # Python and TypeScript probes checked out.  The other matrix entries keep
      # the unit and race coverage; they are not the semantic gate.
      - name: Fetch CLC corpora (no silent skips)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/varwof/capability.git ../capability
          git clone --depth 1 https://github.com/varwof/aic-capability-demo.git ../aic-capability-demo
          missing=0
          for f in \
            data/_vectors/clc-v1/vectors.json \
            data/_vectors/clc-v1/property-cases.json \
            data/_vectors/clc-v1/evidence-vectors.json \
            data/_vectors/clc-v1/crosswalk-vectors.json \
            data/_vectors/clc-v1/profile-declarations.json \
            data/_vectors/clc-v1/resolve-vectors.json \
            data/_vectors/clc-v1/scheme-declaration-vectors.json \
            data/_vectors/clc-v1/quantity-vectors.json \
            data/_vectors/clc-v1/string-domain-vectors.json \
            data/_vectors/clc-v1/offline-vectors.json \
            data/_vectors/clc-v1/param-bounds-meet-property-cases.json \
            data/_vectors/clc-d/containment-vectors.json \
            data/_vectors/clc-d/containment-property-cases.json \
            data/_vectors/clc-d/containment-crosswalk-vectors.json \
            data/_vectors/clc-d/authorize-crosswalk-vectors.json \
            data/_vectors/clc-d/authorize-chain-vectors.json \
            data/_vectors/clc-d/reason-collapse-vectors.json \
            data/_vectors/catalog-v1/catalog-vectors.json \
            data/_vectors/scheme-admin-v1/bootstrap.json \
            data/_vectors/scheme-admin-v1/scheme-admin-vectors.json ; do
            [ -f "../capability/$f" ] || { echo "::error::missing ../capability/$f"; missing=1; }
          done
          exit "$missing"

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"

      - name: Test
        shell: bash
        env:
          CLC_PY_DIR: ${{ github.workspace }}/../aic-capability-demo
          CLC_TS_DIR: ${{ github.workspace }}/../aic-capability-demo/ts
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
